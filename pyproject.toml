[build-system]
requires = ["meson-python>=0.16.0", "meson>=1.11", "ninja>=1.11", "cython>=3.0"]
build-backend = "mesonpy"

[tool.meson-python.args]
# Exclude development artifacts such as MSVC import libraries from wheels.
install = ["--tags=runtime,python-runtime"]

[project]
name = "openal-py"
version = "0.1.1"
description = "Modern Python bindings for OpenAL-soft, with the C library bundled"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["typing_extensions>=4.6; python_version < '3.12'"]
license = { text = "LGPL-2.1-or-later" }
authors = [{ name = "openal-py contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
test = ["pytest", "mypy"]
# File loading for WAV/FLAC/OGG/MP3 and friends (Buffer.from_file)
soundfile = ["soundfile"]

[tool.mypy]
files = ["src/openal_py", "examples"]
strict = true
ignore_missing_imports = true
